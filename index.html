<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trip Planner · 旅行规划合集</title>
<style>
:root{--ink:#20313a;--muted:#687981;--paper:#f6f5f0;--card:#fff;--line:#e4e7e4;--green:#49685e;--gold:#b68b51;--shadow:0 12px 32px rgba(27,43,49,.08)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.68 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
.wrap{max-width:860px;margin:auto;padding:0 22px}
header{padding:72px 0 26px}
.eyebrow{letter-spacing:.18em;text-transform:uppercase;font-size:12px;color:var(--gold);font-weight:700}
h1{font-size:clamp(30px,5vw,46px);margin:12px 0 10px}
header p{color:var(--muted);max-width:560px;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;padding:18px 0 60px}
a.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;color:inherit;text-decoration:none;box-shadow:var(--shadow);transition:transform .15s ease,box-shadow .15s ease}
a.card:hover{transform:translateY(-3px);box-shadow:0 18px 40px rgba(27,43,49,.12);text-decoration:none}
.card .meta{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700}
.card h2{font-size:22px;margin:8px 0 8px}
.card p{margin:0;color:var(--muted);font-size:14px}
.card .go{display:inline-block;margin-top:16px;color:#285d70;font-size:14px;font-weight:600}
footer{border-top:1px solid var(--line);padding:26px 0 40px;color:var(--muted);font-size:13px}
footer a{color:#285d70}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Trip Planner</div>
    <h1>我的旅行规划合集</h1>
    <p>每次出行整理成一份电子旅行手册，包含每日路线、酒店、交通、预算与行前清单。点击卡片查看。</p>
  </header>

  <main class="grid">
    <a class="card" href="tokyo_fuji_hakone_travel_guide.html">
      <div class="meta">Japan · 7 天 6 晚 · 12 月</div>
      <h2>东京 · 富士山 · 箱根</h2>
      <p>两人同行，东京 → 河口湖 → 箱根 → 东京机场，城市漫游、富士山与温泉旅馆。</p>
      <span class="go">打开手册 →</span>
    </a>
    <!-- 以后新增目的地时，复制上面的卡片并修改链接和描述即可 -->
  </main>

  <footer>
    仓库地址：<a href="https://github.com/simplexity01/trip-planner">github.com/simplexity01/trip-planner</a>
  </footer>
</div>
</body>
</html>
